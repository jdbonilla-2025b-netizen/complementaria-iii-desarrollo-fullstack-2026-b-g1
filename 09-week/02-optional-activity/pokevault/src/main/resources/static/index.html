<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeVault</title>
  <style>
    :root { --bg:#fafafa; --ink:#1a1a1a; --muted:#6b7280; --accent:#e63946; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { text-align: center; padding: 2rem; max-width: 520px; }
    .ball {
      width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 1.5rem;
      background: linear-gradient(var(--accent) 0 46%, var(--ink) 46% 54%, #fff 54%);
      border: 4px solid var(--ink); position: relative;
    }
    .ball::after {
      content: ""; position: absolute; inset: 50% auto auto 50%;
      width: 18px; height: 18px; transform: translate(-50%,-50%);
      background: #fff; border: 4px solid var(--ink); border-radius: 50%;
    }
    h1 { font-size: 2.6rem; letter-spacing: -1px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 1rem 0 2rem; line-height: 1.6; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      padding: .75rem 1.5rem; border-radius: 999px; text-decoration: none;
      font-weight: 600; border: 2px solid var(--ink); color: var(--ink);
      transition: all .2s;
    }
    a.primary { background: var(--ink); color: #fff; }
    a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    small { display:block; margin-top:2.5rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="ball"></div>
    <h1>Poke<span>Vault</span></h1>
    <p>A minimal REST API to manage your Pokémon card collection.</p>
    <div class="links">
      <a class="primary" href="/swagger-ui.html">Open API docs</a>
      <a href="/api/cards">View cards (JSON)</a>
    </div>
    <small>Spring Boot · JPA · H2</small>
  </main>
</body>
</html>

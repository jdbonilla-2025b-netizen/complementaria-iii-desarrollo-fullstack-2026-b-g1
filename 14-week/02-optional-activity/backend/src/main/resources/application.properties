server.port=8080
# Config por variables de entorno (valores por defecto = H2 en memoria para desarrollo)
spring.datasource.url=${DB_URL:jdbc:h2:mem:urbanstyle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-al-menos-32-bytes-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

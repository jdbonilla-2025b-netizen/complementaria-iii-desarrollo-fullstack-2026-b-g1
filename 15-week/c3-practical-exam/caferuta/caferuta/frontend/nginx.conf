server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: cualquier ruta (/fincas/3, /panel...) devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Archivos con hash en el nombre: se pueden cachear por mucho tiempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

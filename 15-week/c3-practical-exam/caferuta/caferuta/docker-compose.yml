# Levanta CafeRuta completo en local con:  docker compose up --build
# Las variables se leen de un archivo .env en esta carpeta (ver .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caferuta
      POSTGRES_USER: caferuta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético solo la primera vez (volumen vacío)
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caferuta -d caferuta"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://caferuta:${DB_PASSWORD}@db:5432/caferuta
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
